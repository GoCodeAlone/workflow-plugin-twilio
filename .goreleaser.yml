version: 2

before:
  hooks:
    - go mod tidy
    - >-
      sh -c "sed -i.bak 's/\"version\": \".*\"/\"version\": \"{{ .Version }}\"/' plugin.json && sed -i.bak 's|releases/download/v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*|releases/download/v{{ .Version }}|g' plugin.json && rm -f plugin.json.bak"

builds:
  - id: workflow-plugin-twilio
    main: ./cmd/{{ .ProjectName }}
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=0
      - GOPRIVATE=github.com/GoCodeAlone/*
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/GoCodeAlone/workflow-plugin-twilio/internal.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: GoCodeAlone
    name: workflow-plugin-twilio
